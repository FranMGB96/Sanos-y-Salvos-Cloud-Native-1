spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: pet-service
          uri: lb://pet-service
          predicates:
            - Path=/api/pets/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        - id: bff-service
          uri: lb://bff-service
          predicates:
            - Path=/api/bff/**
          filters:
            - StripPrefix=1
          # Sin AuthenticationFilter: el BFF ahora valida el JWT de Microsoft
          # Entra ID directamente con Spring Security (ver SecurityConfig del
          # bff-service). Ese JWT no es compatible con el AuthenticationFilter
          # interno (que valida el token HS256 propio emitido por user-service).

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]  # <-- PATCH agregado
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: "sanosysalvos-secret-key-2024-duocuc-proyecto-semestral"