spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: pet-service
          uri: lb://pet-service
          predicates:
            - Path=/api/pets/**
          filters:
            - StripPrefix=1

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1

        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories/**
          filters:
            - StripPrefix=1

        - id: bff-service
          uri: lb://bff-service
          predicates:
            - Path=/api/bff/**
          filters:
            - StripPrefix=1
          # Todas las rutas de este gateway quedaron sin AuthenticationFilter:
          # el sistema ahora usa JWT de Microsoft Entra ID (RS256), validado
          # por el BFF con Spring Security, no el token HS256 propio que
          # emitía user-service. Dejar AuthenticationFilter en cualquier ruta
          # rompe esa ruta, porque rechaza el nuevo JWT como inválido.

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: "sanosysalvos-secret-key-2024-duocuc-proyecto-semestral"