server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native          # Lee configs desde el filesystem local
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config   # Carpeta con los YMLs de cada servicio

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
