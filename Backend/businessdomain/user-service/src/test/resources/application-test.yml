# Configuración exclusiva para tests de integración
# Spring activa este archivo automáticamente con @ActiveProfiles("test")
spring:
  datasource:
    url: jdbc:h2:mem:userdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    config:
      enabled: false   # No conectar al Config Server durante tests
  config:
    import: ""
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration

# JWT secret para tests
jwt:
  secret: cGFsYWJyYVNlY3JldGFQYXJhVGVzdHNEZUludGVncmFjaW9uU2Fub3NZU2Fsdm9zMjAyNg==
  expiration: 86400000

eureka:
  client:
    enabled: false   # No registrarse en Eureka durante tests
