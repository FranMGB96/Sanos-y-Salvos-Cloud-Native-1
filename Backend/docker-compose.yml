services:

  # ─── BASES DE DATOS ───────────────────────────────────────────
  user-db:
    image: mysql:8.0
    container_name: user-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    networks:
      - petshop-net
    volumes:
      - user-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  pet-db:
    image: mysql:8.0
    container_name: pet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pet_db
    ports:
      - "3308:3306"
    networks:
      - petshop-net
    volumes:
      - pet-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  report-db:
    image: mysql:8.0
    container_name: report-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: report_db
    ports:
      - "3309:3306"
    networks:
      - petshop-net
    volumes:
      - report-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  category-db:
    image: mysql:8.0
    container_name: category-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: category_db
    ports:
      - "3310:3306"
    networks:
      - petshop-net
    volumes:
      - category-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RABBITMQ (clúster de 2 nodos) ────────────────────────────
  rabbitmq-1:
    image: rabbitmq:4.0-management
    container_name: rabbitmq-1
    restart: unless-stopped
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sanos_admin
      RABBITMQ_DEFAULT_PASS: Sanos2026
      RABBITMQ_ERLANG_COOKIE: sanosysalvos_cookie_secreta
    volumes:
      - rabbitmq-data-1:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  rabbitmq-2:
    image: rabbitmq:4.0-management
    container_name: rabbitmq-2
    restart: unless-stopped
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: sanos_admin
      RABBITMQ_DEFAULT_PASS: Sanos2026
      RABBITMQ_ERLANG_COOKIE: sanosysalvos_cookie_secreta
    volumes:
      - rabbitmq-data-2:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - petshop-net
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ─── INFRAESTRUCTURA ──────────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: infrastructure/eureka-server/Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - petshop-net

  # ─── MICROSERVICIOS DE NEGOCIO ────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: businessdomain/user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: user-db
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - petshop-net

  pet-service:
    build:
      context: .
      dockerfile: businessdomain/pet-service/Dockerfile
    container_name: pet-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: pet-db
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
      PET_SERVICE_BASE_URL: https://34.194.16.77.sslip.io
    depends_on:
      pet-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - petshop-net

  report-service:
    build:
      context: .
      dockerfile: businessdomain/report-service/Dockerfile
    container_name: report-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: report-db
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      report-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - petshop-net

  category-service:
    build:
      context: .
      dockerfile: businessdomain/category-service/Dockerfile
    container_name: category-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_HOST: category-db
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      category-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - petshop-net

  bff-service:
    build:
      context: .
      dockerfile: infrastructure/bff-service/Dockerfile
    container_name: bff-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
      USER_SERVICE_URL: http://user-service:8081
      PET_SERVICE_URL: http://pet-service:8082
      REPORT_SERVICE_URL: http://report-service:8083
    depends_on:
      - user-service
      - pet-service
      - report-service
    networks:
      - petshop-net

  # ─── ADMINISTRACIÓN DE RABBITMQ (API REST) ────────────────────
  rabbitmq-admin-service:
    build:
      context: .
      dockerfile: infrastructure/rabbitmq-admin-service/Dockerfile
    container_name: rabbitmq-admin-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    networks:
      - petshop-net

  # ─── KAFKA: ZOOKEEPER (3 nodos) ───────────────────────────────
  # Los 3 ZooKeeper forman un ensemble: si se cae uno, los otros dos
  # siguen coordinando el clúster (se necesita mayoría, 2 de 3).
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-1
    restart: unless-stopped
    hostname: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    volumes:
      - zookeeper-data-1:/var/lib/zookeeper/data
      - zookeeper-log-1:/var/lib/zookeeper/log
    mem_limit: 256m
    networks:
      - petshop-net

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-2
    restart: unless-stopped
    hostname: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    volumes:
      - zookeeper-data-2:/var/lib/zookeeper/data
      - zookeeper-log-2:/var/lib/zookeeper/log
    mem_limit: 256m
    networks:
      - petshop-net

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-3
    restart: unless-stopped
    hostname: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
      KAFKA_HEAP_OPTS: "-Xms64m -Xmx128m"
    volumes:
      - zookeeper-data-3:/var/lib/zookeeper/data
      - zookeeper-log-3:/var/lib/zookeeper/log
    mem_limit: 256m
    networks:
      - petshop-net

  # ─── KAFKA: BROKERS (3 nodos) ─────────────────────────────────
  # Cada broker tiene dos "puertas":
  #   INTERNAL (kafka-N:29092) -> la usan los microservicios y Kafka UI dentro de Docker
  #   EXTERNAL (localhost:9092/9093/9094) -> para conectarse desde la misma máquina (pruebas y CLI)
  # Los puertos externos quedan amarrados a 127.0.0.1, así no quedan abiertos a internet en la EC2.
  # Con 3 brokers usamos replication factor 3 y min.insync.replicas 2:
  # se puede caer un broker y se sigue escribiendo sin perder datos.
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    restart: unless-stopped
    hostname: kafka-1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    mem_limit: 640m
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    restart: unless-stopped
    hostname: kafka-2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    mem_limit: 640m
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    restart: unless-stopped
    hostname: kafka-3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafka-data-3:/var/lib/kafka/data
    mem_limit: 640m
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - petshop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/29092' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── KAFKA UI ─────────────────────────────────────────────────
  # Panel web para ver topics, particiones, mensajes y consumer groups (lag).
  # Va en el 8090 porque el 8080 lo usa el api-gateway.
  # En la EC2 se abre con túnel SSH (-L 8090:localhost:8090), igual que el dashboard de RabbitMQ.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanosysalvos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 384m
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - petshop-net

  # ─── SERVICIOS DE KAFKA (Evaluación 3) ────────────────────────
  # analytics-service: Kafka Streams (contadores en vivo y alertas por zona)
  analytics-service:
    build:
      context: .
      dockerfile: businessdomain/analytics-service/Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    depends_on:
      config-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - petshop-net

  # kafka-admin-service: API REST para administrar topics y consumer groups
  # Igual que el admin de RabbitMQ, en la EC2 se usa con túnel SSH (-L 8087:localhost:8087)
  kafka-admin-service:
    build:
      context: .
      dockerfile: infrastructure/kafka-admin-service/Dockerfile
    container_name: kafka-admin-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      config-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - petshop-net


  # ─── FRONTEND ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - petshop-net

networks:
  petshop-net:
    driver: bridge

volumes:
  user-db-data:
  pet-db-data:
  report-db-data:
  category-db-data:
  rabbitmq-data-1:
  rabbitmq-data-2:
  zookeeper-data-1:
  zookeeper-log-1:
  zookeeper-data-2:
  zookeeper-log-2:
  zookeeper-data-3:
  zookeeper-log-3:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:


#docker compose up -d user-db pet-db report-db category-db

#docker compose up -d user-db pet-db report-db category-db eureka-server config-server
#docker compose up --build


